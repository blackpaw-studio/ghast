name: Ghast
options:
  bundleIdPrefix: net.evancoleman
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.0"
  ENABLE_PREVIEWS: YES
  DEVELOPMENT_ASSET_PATHS: "\"Ghast/Preview Content\""

targets:
  Ghast:
    type: application
    platform: macOS
    sources:
      - path: Ghast
        excludes:
          - "*.md"
    info:
      path: Ghast/Info.plist
      properties:
        CFBundleDisplayName: Ghast
        LSMultipleInstancesProhibited: true
        CFBundleURLTypes:
          - CFBundleURLName: net.evancoleman.ghast.oauth
            CFBundleURLSchemes: [ghast]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.evancoleman.ghast
      CODE_SIGN_ENTITLEMENTS: Ghast/Ghast.entitlements
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: KeychainAccess
      - package: Alamofire
    
packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: "5.8.1"