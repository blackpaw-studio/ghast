name: Ghast
options:
  bundleIdPrefix: net.evancoleman
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.0"
  ENABLE_PREVIEWS: YES
  DEVELOPMENT_ASSET_PATHS: "\"Ghast/Preview Content\""

targets:
  Ghast:
    type: application
    platform: macOS
    sources:
      - path: Ghast
        excludes:
          - "*.md"
    info:
      path: Ghast/Info.plist
      properties:
        CFBundleDisplayName: Ghast
        CFBundleIconFile: ""
        LSMultipleInstancesProhibited: true
        CFBundleURLTypes:
          - CFBundleURLName: net.evancoleman.ghast.oauth
            CFBundleURLSchemes: [ghast]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.evancoleman.ghast
      CODE_SIGN_ENTITLEMENTS: Ghast/Ghast.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 52M9C6892K
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: KeychainAccess
      - package: Alamofire

  GhastTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GhastTests
    dependencies:
      - target: Ghast
      - package: SnapshotTesting
    settings:
      BUNDLE_LOADER: $(BUILT_PRODUCTS_DIR)/Ghast.app/Contents/MacOS/Ghast
      TEST_HOST: $(BUNDLE_LOADER)
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: net.evancoleman.ghast.tests
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 52M9C6892K
    
packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: "5.8.1"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.15.0"

schemes:
  Ghast:
    build:
      targets:
        Ghast: all
        GhastTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GhastTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  
  Ghast-RecordSnapshots:
    build:
      targets:
        Ghast: all
        GhastTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GhastTests
      environmentVariables:
        SNAPSHOT_RECORD_MODE: "true"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release