name: Ghast
options:
  bundleIdPrefix: net.evancoleman
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.0"
  ENABLE_PREVIEWS: YES
  DEVELOPMENT_ASSET_PATHS: "\"Ghast/Preview Content\""

targets:
  Ghast:
    type: application
    platform: macOS
    sources:
      - path: Ghast
        excludes:
          - "*.md"
    info:
      path: Ghast/Info.plist
      properties:
        CFBundleDisplayName: Ghast
        CFBundleIconFile: "AppIcon"
        LSMultipleInstancesProhibited: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2025 Blackpaw Studio, LLC. All rights reserved."
        LSApplicationCategoryType: "public.app-category.developer-tools"
        CFBundleURLTypes:
          - CFBundleURLName: net.evancoleman.ghast.oauth
            CFBundleURLSchemes: [ghast]
        SUFeedURL: "https://evancoleman.net/ghast/appcast.xml"
        SUPublicEDKey: "YOUR_PUBLIC_KEY_HERE"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.evancoleman.ghast
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Local builds/tests: ad-hoc signed (as leoterm's Debug config), no team or
        # profile needed. Debug entitlements drop keychain-access-groups, which
        # requires a provisioning profile.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Ghast/GhastDebug.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          OTHER_CODE_SIGN_FLAGS: ""
        # Release (archive/notarize): unchanged Automatic + team signing.
        Release:
          CODE_SIGN_ENTITLEMENTS: Ghast/Ghast.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 52M9C6892K
    dependencies:
      - package: KeychainAccess
      - package: Alamofire
      - package: Sparkle

  GhastTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GhastTests
    dependencies:
      - target: Ghast
      - package: SnapshotTesting
    settings:
      base:
        BUNDLE_LOADER: $(BUILT_PRODUCTS_DIR)/Ghast.app/Contents/MacOS/Ghast
        TEST_HOST: $(BUNDLE_LOADER)
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.evancoleman.ghast.tests
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
        Release:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: 52M9C6892K

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: "5.8.1"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.15.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"

schemes:
  Ghast:
    build:
      targets:
        Ghast: all
        GhastTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GhastTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  
  Ghast-RecordSnapshots:
    build:
      targets:
        Ghast: all
        GhastTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GhastTests
      environmentVariables:
        SNAPSHOT_RECORD_MODE: "true"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release