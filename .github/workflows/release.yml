name: Release and Notarize

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1)'
        required: true

jobs:
  build-and-notarize:
    name: Build, Notarize, and Release
    runs-on: macos-26
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'
    
    - name: Install dependencies
      run: |
        brew install xcodegen jq
    
    - name: Create signing keychain
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      run: .github/scripts/keychain.sh create

    - name: Generate Xcode project
      run: xcodegen
    
    - name: Build and Archive
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        SIGN_IDENTITY: Developer ID Application
      run: |
        xcodebuild archive \
          -project Ghast.xcodeproj \
          -scheme Ghast \
          -configuration Release \
          -archivePath build/Ghast.xcarchive \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
          OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN --timestamp --options=runtime"
    
    - name: Export Archive
      run: |
        xcodebuild -exportArchive \
          -archivePath build/Ghast.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist ExportOptions.plist
    
    - name: Create ZIP for notarization
      run: |
        cd build/export
        zip -r -y ../Ghast.zip Ghast.app
        cd ../..
    
    - name: Notarize app
      env:
        APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
        APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
      run: |
        # Materialize the App Store Connect API key (.p8) in a throwaway dir
        KEY_DIR="$(mktemp -d "$RUNNER_TEMP/notary.XXXXXX")"
        trap 'rm -rf "$KEY_DIR"' EXIT
        printf '%s' "$APPLE_NOTARIZATION_KEY" > "$KEY_DIR/notary-key.p8"

        xcrun notarytool submit build/Ghast.zip \
          --key "$KEY_DIR/notary-key.p8" \
          --key-id "$APPLE_NOTARIZATION_KEY_ID" \
          --issuer "$APPLE_NOTARIZATION_ISSUER" \
          --wait \
          --timeout 30m

    - name: Staple notarization ticket
      run: |
        xcrun stapler staple build/export/Ghast.app
    
    - name: Create final distribution ZIP
      run: |
        cd build/export
        zip -r -y ../Ghast-notarized.zip Ghast.app
        cd ../..
    
    - name: Generate Sparkle signature
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        SPARKLE_VERSION: '2.9.6'
        SPARKLE_SHA256: 52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192
      run: |
        if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
          echo "::error::SPARKLE_PRIVATE_KEY secret is not set; cannot sign the update"
          exit 1
        fi

        # Download prebuilt Sparkle tools (sign_update) for a pinned release
        mkdir -p sparkle-tools
        curl -fsSL -o sparkle-tools/Sparkle.tar.xz \
          "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
        # sign_update receives the private key: refuse an unverified binary
        echo "${SPARKLE_SHA256}  sparkle-tools/Sparkle.tar.xz" | shasum -a 256 -c -
        tar -xJf sparkle-tools/Sparkle.tar.xz -C sparkle-tools

        # Sign the update; the key is read from stdin so it never touches disk.
        # Output: sparkle:edSignature="..." length="..."
        SIGNATURE=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | ./sparkle-tools/bin/sign_update --ed-key-file - build/Ghast-notarized.zip)
        echo "SPARKLE_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: build/Ghast-notarized.zip
        draft: true
        prerelease: false
        body: |
          ## What's New
          
          <!-- Add release notes here -->
          
          ## Installation
          
          1. Download `Ghast-notarized.zip`
          2. Unzip and drag Ghast.app to your Applications folder
          3. Launch Ghast
          
          ## Sparkle Update Signature
          
          ```
          ${{ env.SPARKLE_SIGNATURE }}
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ghast-release
        path: |
          build/Ghast-notarized.zip
          build/Ghast.xcarchive

    - name: Destroy signing keychain
      if: always()
      run: .github/scripts/keychain.sh cleanup
